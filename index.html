<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());

firebase.initializeApp({
  apiKey: "",
  authDomain: "commentmadokers.firebaseapp.com",
  databaseURL: "",
  projectId: "commentmadokers"
});

const db = firebase.database();
const MAX_SEND = 2;
const WINDOW_MS = 3000;
let sendCount = 0;
let firstSendTime = 0;
const COOLDOWN_MS = 1500;

function submitComment() {

  const now = Date.now();
  const lastSend = localStorage.getItem("lastSend");

  if (lastSend && now - lastSend < COOLDOWN_MS) {
    return;
  }

  if (firstSendTime === 0 || now - firstSendTime > WINDOW_MS) {
    firstSendTime = now;
    sendCount = 0;
  }

  sendCount++;
  if (sendCount > MAX_SEND) return;

  const nameEl = document.getElementById("comment-name");
  const textEl = document.getElementById("comment-text");

  const name = nameEl.value.trim();
  const text = textEl.value.trim();

  if (!name || !text) return;
  if (name.length > 30 || text.length > 300) return;

  localStorage.setItem("lastSend", now);

  db.ref("comments").push({
    name,
    text,
    timestamp: now
  }).then(() => {
    textEl.value = "";
  });
}

function loadComments() {
  const list = document.getElementById("comments-list");

  db.ref("comments").limitToLast(50).on("value", snap => {
    list.innerHTML = "";

    const data = snap.val();
    if (!data) return;

    Object.values(data).reverse().forEach(c => {

      const wrap = document.createElement("div");
      wrap.className = "comment";

      const head = document.createElement("div");
      head.className = "comment-header";

      const n = document.createElement("span");
      n.className = "comment-name";
      n.textContent = c.name;

      const t = document.createElement("span");
t.className = "comment-time";

const date = new Date(c.timestamp);
let hours = date.getHours();
const minutes = String(date.getMinutes()).padStart(2,'0');
const ampm = hours >= 12 ? 'PM' : 'AM';
hours = hours % 12;
hours = hours ? hours : 12;

t.textContent = `${hours}:${minutes} ${ampm}`;

      const textDiv = document.createElement("div");
      textDiv.textContent = c.text;

      head.appendChild(n);
      head.appendChild(t);

      wrap.appendChild(head);
      wrap.appendChild(textDiv);

      list.appendChild(wrap);
    });
  });
}

window.addEventListener("DOMContentLoaded", () => {
  loadComments();

  document.getElementById("comment-form").addEventListener("submit", e => {
    e.preventDefault();
    submitComment();
  });
});
</script>
